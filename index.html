<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free In-Browser AI</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    #output {
      background: #f4f4f9;
      padding: 15px;
      border-radius: 8px;
      min-height: 80px;
      white-space: pre-wrap;
      margin-top: 15px;
      border: 1px solid #e0e0e6;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h2>My Free GitHub AI</h2>
  <p id="status">Loading AI model (first load takes ~10 seconds)...</p>

  <div class="input-row">
    <input type="text" id="prompt" placeholder="Ask something..." disabled />
    <button id="send-btn" disabled>Ask</button>
  </div>

  <div id="output">AI response will appear here...</div>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.0';

    const statusEl = document.getElementById('status');
    const promptInput = document.getElementById('prompt');
    const sendBtn = document.getElementById('send-btn');
    const outputEl = document.getElementById('output');

    const generator = await pipeline(
      'text-generation',
      'HuggingFaceTB/SmolLM2-360M-Instruct',
      { dtype: 'q4' }
    );

    statusEl.textContent = 'AI Ready! (Running 100% in your browser)';
    promptInput.disabled = false;
    sendBtn.disabled = false;

    async function handleSend() {
      const userText = promptInput.value.trim();
      if (!userText) return;

      sendBtn.disabled = true;
      promptInput.disabled = true;
      outputEl.textContent = 'Thinking...';

      const messages = [
        { role: 'system', content: 'You are a helpful, concise website assistant.' },
        { role: 'user', content: userText }
      ];

      const result = await generator(messages, { max_new_tokens: 150 });
      outputEl.textContent = result[0].generated_text.at(-1).content;

      sendBtn.disabled = false;
      promptInput.disabled = false;
      promptInput.focus();
    }

    sendBtn.addEventListener('click', handleSend);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSend();
    });
  </script>

</body>
</html>
